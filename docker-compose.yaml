services:
  postgres:
    container_name: app-postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: poluchka
      POSTGRES_USER: poluchka
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
      - ./docker/postgres/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U poluchka -d poluchka" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  keycloak:
    container_name: app-keycloak
    build: ./docker/keycloak
    environment:
#      KC_BOOTSTRAP_ADMIN_USERNAME: admin # после первого запуска нужно убрать
#      KC_BOOTSTRAP_ADMIN_PASSWORD: admin # после первого запуска нужно убрать
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: poluchka
      KC_DB_PASSWORD: password
      KC_HTTP_ENABLED: "true" # для реального TLS false
      KC_HOSTNAME_STRICT: "false"
#      KC_HOSTNAME: dopoluchki.howto.org
#      KC_PROXY_HEADERS: xforwarded   # только если TLS-прокси шлёт X-Forwarded-*
    ports:
      - "8001:8080"
    volumes:
      - ./.data/keycloak:/opt/keycloak/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
