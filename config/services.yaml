# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
          - '../src/DependencyInjection/'
          - '../src/Entity/'
          - '../src/DTO'
          - '../src/Kernel.php'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
    app.log_formatter:
      class: App\Logging\LevelColoredFormatter
      arguments:
        $format: "%%datetime%% %%level_name%% --- [%%channel%%] : %%message%% %%context%% %%extra%%\n"
        $dateFormat: "d-m-Y H:i:s.v"
        $allowInlineLineBreaks: true
        $ignoreEmptyContextAndExtra: true
        $enableColors: true

    app.prod_log_formatter:
      class: App\Logging\LevelColoredFormatter
      arguments:
        $format: "%%datetime%% %%level_name%% --- [%%channel%%] : %%message%% %%context%% %%extra%%\n"
        $dateFormat: "d-m-Y H:i:s.v"
        $allowInlineLineBreaks: true
        $ignoreEmptyContextAndExtra: true
        $enableColors: false

    Monolog\Processor\IntrospectionProcessor:
      arguments:
        $level: !php/const Monolog\Level::Debug
        # Пропускаем классы самого Symfony/Monolog, чтобы найти именно ваш контроллер или сервис
        $skipClassesPartials:
          - 'Monolog\'
          - 'Psr\Log\'
          - 'Symfony\Bridge\Monolog\'
      tags:
        - { name: monolog.processor }

    app.class_level_filter_handler:
      class: App\Logging\ClassLevelFilterHandler
      arguments:
        # Оборачиваем стандартный хендлер monolog (в Symfony он называется monolog.handler.<имя_хендлера>)
        $innerHandler: '@monolog.handler.console_out'
        # Уровень по умолчанию для всего остального (системные классы Symfony, Doctrine, Request и т.д.)
        $defaultLevel: 'error'
        $rules:
          'Symfony\': 'warning'
          'App\': 'info'
          'App\Controller\HomeController': 'debug'

    app.prod_class_level_filter_handler:
      class: App\Logging\ClassLevelFilterHandler
      arguments:
        $innerHandler: '@monolog.handler.prod_file'
        $defaultLevel: 'warning'
        $rules:
          'App\': 'info'
