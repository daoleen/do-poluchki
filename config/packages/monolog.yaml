# yaml-language-server: $schema=../../vendor/symfony/dependency-injection/Loader/schema/services.schema.json
monolog:
    channels: # To see all channels, run bin/console debug:autowiring logger
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists

when@dev:
    monolog:
        handlers:
#            main:
#                type: stream
#                path: "%kernel.logs_dir%/%kernel.environment%.log"
#                level: debug
#                channels: ["!event"]
#                formatter: app.log_formatter
#            console:
#                type: console
#                process_psr_3_messages: false
#                channels: ["!event", "!doctrine", "!console"]
#                formatter: app.log_formatter
          filter_proxy:
            type: service
            id: app.class_level_filter_handler

          console_out:
            type: stream
            path: "php://stderr"
            level: debug
            nested: true
#            channels: ["!event", "!doctrine"]
            formatter: app.log_formatter

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

when@prod:
    monolog:
        handlers:
            filter_proxy:
              type: service
              id: app.prod_class_level_filter_handler
            prod_file:
              type: rotating_file
              path: "%kernel.logs_dir%/%kernel.environment%.log"
              level: debug
              max_files: 2
              nested: true
              formatter: app.prod_log_formatter
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]
